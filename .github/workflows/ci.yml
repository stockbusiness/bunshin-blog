name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチへの連続pushでは古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: lint
        run: npm run lint

      - name: 整形の確認
        run: npm run format:check

      - name: typecheck
        run: npm run typecheck

      - name: test（カバレッジ付き）
        run: npm run test:coverage

      - name: build
        run: npm run build

      - name: カバレッジを保存
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  schema:
    name: prisma schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bunshin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bunshin_ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: スキーマを検証
        run: npx prisma validate

      - name: マイグレーションを適用
        run: npx prisma migrate deploy

      - name: マイグレーションとスキーマの乖離を検出
        run: |
          # 適用後のDBと schema.prisma を比較する。差分があれば
          # マイグレーションの追加漏れ（--exit-code は差分ありで 2）
          set +e
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code > /tmp/drift.sql
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 2 ]; then
            echo "::error::schema.prisma とマイグレーションが一致していない"
            cat /tmp/drift.sql
            exit 1
          fi
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          echo "乖離なし"

      - name: 適用結果を確認
        run: |
          psql "$DATABASE_URL" -c "\dt"
          TABLES=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public'")
          TYPES=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from pg_type t
             join pg_namespace n on n.oid = t.typnamespace
             where n.nspname='public' and t.typtype='e'")
          CHECKS=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from pg_constraint
             where contype='c' and conname in
               ('blogs_slot_range','content_items_outbound_max',
                'admin_login_tokens_expiry_after_creation',
                'admin_login_tokens_used_after_creation',
                'app_settings_secret_column','app_settings_key_format')")
          echo "テーブル数: $TABLES / enum型数: $TYPES / CHECK制約: $CHECKS"
          if [ "$TABLES" -lt 1 ]; then
            echo "::error::テーブルが作成されていない"
            exit 1
          fi
          # DATA_MODEL 4章でDB側にも入れると定めた6件
          if [ "$CHECKS" -ne 6 ]; then
            echo "::error::CHECK制約が6件そろっていない（$CHECKS 件）"
            exit 1
          fi

      - name: CHECK制約が実際に効くことを確認
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into users (id, display_name, updated_at)
             values ('00000000-0000-0000-0000-000000000001','検証用',now())"

          # ブログは分身の媒体で、persona_id は NOT NULL（A-2-R-3）
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into personas (id, user_id, name, persona_type,
                                   identity, expertise, audience, business,
                                   updated_at)
             values ('00000000-0000-0000-0000-0000000000a1',
                     '00000000-0000-0000-0000-000000000001',
                     '検証用','SELF','{}'::jsonb,'{}'::jsonb,'{}'::jsonb,
                     '{}'::jsonb,now())"

          # slot_number は 1〜3 のみ許可される（blogs_slot_range）
          #
          # **publish_time を必ず書く**（C-9-schema-2 で NOT NULL）。
          # 省くと、下の「拒否されるはず」の insert が
          # **狙った制約ではなく NOT NULL で落ちて、素通りする**
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into blogs (id, user_id, persona_id, name, slug, target_reader,
                                article_ratio, slot_number, publish_time, updated_at)
             values ('00000000-0000-0000-0000-000000000002',
                     '00000000-0000-0000-0000-000000000001',
                     '00000000-0000-0000-0000-0000000000a1',
                     'ok','ok','r','{}'::jsonb,3,'09:00',now())"
          echo "slot_number=3 は登録できた"

          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into blogs (id, user_id, persona_id, name, slug, target_reader,
                                article_ratio, slot_number, publish_time, updated_at)
             values ('00000000-0000-0000-0000-000000000003',
                     '00000000-0000-0000-0000-000000000001',
                     '00000000-0000-0000-0000-0000000000a1',
                     'ng','ng','r','{}'::jsonb,4,'09:00',now())" \
            > /dev/null 2>&1; then
            echo "::error::slot_number=4 が登録できてしまった"
            exit 1
          fi
          echo "slot_number=4 は拒否された"

          # 他人の分身は紐づけられない（blogs_persona_id_user_id_fkey・A-2-R-2c-schema）
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into users (id, display_name, updated_at)
             values ('00000000-0000-0000-0000-0000000000b1','別人',now())"

          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into blogs (id, user_id, persona_id, name, slug, target_reader,
                                article_ratio, slot_number, publish_time, updated_at)
             values ('00000000-0000-0000-0000-000000000004',
                     '00000000-0000-0000-0000-0000000000b1',
                     '00000000-0000-0000-0000-0000000000a1',
                     'ng','ng2','r','{}'::jsonb,1,'09:00',now())" \
            > /dev/null 2>&1; then
            echo "::error::他人の分身IDでブログが作れてしまった"
            exit 1
          fi
          echo "他人の分身は拒否された"

          # 公開曜日は空にできない（blogs_publish_weekdays_not_empty・C-9-schema-3）
          #
          # **空の配列はどの曜日にも当たらない。** 時刻があっても一度も
          # 公開されないまま、ブログは ACTIVE で記事だけが溜まる
          if psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "insert into blogs (id, user_id, persona_id, name, slug, target_reader,
                                article_ratio, slot_number, publish_time,
                                publish_weekdays, updated_at)
             values ('00000000-0000-0000-0000-000000000005',
                     '00000000-0000-0000-0000-000000000001',
                     '00000000-0000-0000-0000-0000000000a1',
                     'ng','ng3','r','{}'::jsonb,2,'09:00','{}',now())" \
            > /dev/null 2>&1; then
            echo "::error::公開曜日が空のブログが登録できてしまった"
            exit 1
          fi
          echo "空の公開曜日は拒否された"

      - name: 統合テスト
        run: |
          # 前のステップで入れた検証用データを消してから走らせる
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "truncate table blogs, users restart identity cascade"
          npm run test:integration
